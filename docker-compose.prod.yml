services:
  zhotoveno-veletrh:
    image: zhotoveno-veletrh:${DEPLOY_SHA:?DEPLOY_SHA is required}
    build:
      context: .
    env_file:
      - ${FAIR_ENV_FILE:-/srv/zhotoveno-veletrh/shared/env/veletrh.env}
    environment:
      NODE_ENV: production
      PORT: 3013
      HOSTNAME: 0.0.0.0
      FAIR_DB_PATH: /data/fair-reminders.sqlite
    expose:
      - "3013"
    volumes:
      - type: bind
        source: ${FAIR_DATA_DIR:-/srv/zhotoveno-veletrh/shared/data}
        target: /data
    networks:
      proxy:
        aliases:
          - zhotoveno-veletrh
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://127.0.0.1:3013/api/health',(res)=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.setTimeout(5000,()=>{req.destroy();process.exit(1)});"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: "1"
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
